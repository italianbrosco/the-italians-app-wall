<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183f37" />
    <meta
      name="description"
      content="Italian Bros is an independent studio creating focused mobile apps and original games."
    />
    <meta property="og:title" content="Italian Bros — Independent app studio" />
    <meta
      property="og:description"
      content="Independent apps, made with care by Italian Bros."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://italianbrosco.com/" />
    <title>Italian Bros — Independent product studio</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20260822.2" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Italian Bros",
        "url": "https://italianbrosco.com/",
        "description": "An independent app studio making focused mobile tools and original games."
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#apps">Skip to apps</a>

    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="/" aria-label="Italian Bros home">
        <img class="brand-logo" src="/assets/brand/italian-bros-crest-transparent.png" alt="" width="495" height="512" />
      </a>
      <img class="brand-wordmark" src="/assets/brand/italian-bros-wordmark.png" alt="Italian Bros Co." width="720" height="180" />

      <nav class="site-nav" aria-label="Page links">
        <a href="#apps">Apps</a>
      </nav>
    </header>

    <main class="showcase-shell">
      <section class="apps-showcase" id="apps" aria-labelledby="apps-title">
        <div class="apps-heading">
          <div>
            <p>Made in our workshop</p>
            <h2 id="apps-title">Meet the apps</h2>
          </div>
          <p class="apps-count"><strong data-total-count>19</strong> independent products<br />for work, life, and play<span class="release-snapshot">Catalog updated August 22, 2026</span></p>
        </div>
        <div class="app-grid" id="app-grid"></div>
        <noscript><p class="noscript-note">Turn on JavaScript to view the app collection.</p></noscript>
      </section>

    </main>

    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="Close app details">×</button>
      <img id="dialog-icon" alt="" width="384" height="384" />
      <p id="dialog-category"></p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <div class="dialog-status"><i aria-hidden="true"></i>Release updates coming soon</div>
      <button class="dialog-done" type="button">Done</button>
    </dialog>

    <script src="/catalog.js?v=20260822.1"></script>
    <script src="/app.js?v=20260822.1"></script>
  </body>
</html>
